[project]
name = "flashcardsbot"
version = "0.1.0"
description = "A vocabulary learning system that parses lesson content from a website, extracts new words and their definitions, and organizes them into lesson-specific flashcards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3",
    "httpx>=0.28.1",
    "pydantic[email]>=2.4,<2.14",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
]

[tool.ruff]
# Set the maximum line length to 120.
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
lines-after-imports = 2
